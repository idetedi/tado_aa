[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Aviso interno de python-tado con pydantic >= 2.11; no depende de este proyecto.
filterwarnings = ["ignore::pydantic.warnings.PydanticDeprecatedSince211"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
